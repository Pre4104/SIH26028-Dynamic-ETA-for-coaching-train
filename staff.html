<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff &amp; Control Room – RailWise</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{--pri:#15658f;--bd:#dce3ea;--mut:#6b7280;--ok:#2e7d32;--warn:#e69a00;--bad:#c62828}
body{background:#f4f7fa;color:#1f2933}
.top{background:var(--pri);color:#fff}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tabbar button{border:1px solid var(--bd);background:#fff;padding:7px 14px;border-radius:8px}
.tabbar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card2{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 4px 15px rgba(18,53,91,.08)}
.card2 h3{font-size:16px;margin:0 0 10px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}.row2:last-child{border:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.hm div{border-radius:8px;padding:8px 4px;color:#fff;font-size:12px;text-align:center;cursor:pointer}
.mut{color:var(--mut);font-size:13px}.tbl{overflow-x:auto}
</style></head><body>
<div class="top"><div class="container d-flex flex-wrap justify-content-between align-items-center py-3 gap-2">
  <div><b class="fs-5"><i class="bi bi-train-front"></i> RailWise</b> <span class="opacity-75">· <span id="portalName"></span></span></div>
  <div class="d-flex align-items-center gap-3"><span id="who" class="small"></span>
    <button class="btn btn-sm btn-light" id="out"><i class="bi bi-box-arrow-right"></i> Logout</button></div>
</div></div>
<div class="container pb-5"><div class="tabbar" id="tabs"></div><div id="v"></div>
<p class="mut">Simulated data for demo. Role access: Staff sees Network, Downstream and Crew &amp; cleaning; Control room sees everything.</p></div>
<script src="js/auth.js" data-guard="staff"></script>
<script src="js/staff.js"></script>
</body></html>
